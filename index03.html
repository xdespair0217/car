<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>黑盒數位觀測站 - 維修解構誌 (CBS)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f1115; color: #e2e8f0; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #181b22; }
        ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Top Header -->
    <header class="h-14 bg-[#14171f] border-b border-[#262c38] flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center space-x-4">
            <div class="flex items-center space-x-2">
                <span class="w-3 h-3 rounded-full bg-amber-500 animate-pulse"></span>
                <h1 class="font-bold text-lg tracking-wider text-slate-100">黑盒數位觀測站 <span class="text-xs text-amber-400 font-mono ml-2 border border-amber-500/30 px-2 py-0.5 rounded">CBS 即時同步中</span></h1>
            </div>
            <span class="text-xs text-slate-400 hidden md:inline">| 透過虛擬與現實交錯，解構未知的真相</span>
        </div>
        <div class="flex items-center space-x-3 text-sm">
            <span class="bg-[#1f2430] px-3 py-1 rounded text-slate-300 border border-[#2e3646]" id="total-count">文章總計: 載入中...</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Left Sidebar: Article List -->
        <aside class="w-[420px] bg-[#12151b] border-r border-[#262c38] flex flex-col shrink-0">
            <!-- Search & Tags -->
            <div class="p-4 border-b border-[#262c38] space-y-3">
                <div class="relative">
                    <input type="text" id="search-input" placeholder="搜尋車型、部位、故障碼 DTC 或標題..." 
                           class="w-full bg-[#1a1e29] border border-[#2a3243] rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                </div>
                <!-- Dynamic Tag Filters -->
                <div class="flex flex-wrap gap-1.5" id="tag-filters">
                    <button onclick="filterByPart('全部')" class="tag-btn active text-xs px-2.5 py-1 rounded bg-amber-500/20 text-amber-400 border border-amber-500/40 font-medium transition">全部</button>
                </div>
            </div>

            <!-- List of Articles -->
            <div class="flex-1 overflow-y-auto divide-y divide-[#1f2430]" id="case-list-container">
                <div class="p-8 text-center text-slate-500 text-sm">正在從 Google 試算表同步資料...</div>
            </div>
        </aside>

        <!-- Right Content: Article Reader & Document Canvas -->
        <main class="flex-1 bg-[#14171f] flex flex-col relative overflow-y-auto" id="main-viewer-area">
            
            <!-- Default Empty State -->
            <div id="empty-state" class="m-auto text-center space-y-3 p-8">
                <div class="w-16 h-16 rounded-full bg-[#1b202c] border border-[#2e3646] flex items-center justify-center mx-auto text-amber-400 text-2xl font-mono">📖</div>
                <h2 class="text-slate-200 font-medium">請從左側文章清單選取一篇維修解構報告</h2>
                <p class="text-slate-500 text-sm max-w-md">系統將以文章閱讀器的沈浸式框架，為您解構該車型與故障碼的技術檔案。</p>
            </div>

            <!-- Article Reader Content Wrapper (Hidden initially) -->
            <div id="article-container" class="hidden max-w-4xl w-full mx-auto p-10 bg-[#fbf9f5] text-slate-900 min-h-full my-auto shadow-2xl rounded-none">
                
                <!-- Article Header Meta -->
                <div class="border-b border-slate-300 pb-6 mb-6">
                    <div class="flex items-center justify-between text-xs font-mono text-slate-500 mb-3">
                        <span id="art-meta-tag" class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded font-semibold">-</span>
                        <span id="art-meta-date">-</span>
                    </div>
                    <h1 id="art-title" class="text-2xl font-bold tracking-tight text-slate-900 leading-snug">
                        <!-- Title -->
                    </h1>
                </div>

                <!-- DTC Highlight Box -->
                <div id="art-dtc-box" class="bg-amber-50 border-l-4 border-amber-600 p-4 my-6 text-sm font-mono text-amber-900 rounded-r">
                    <span class="font-bold">高亮故障碼標籤 (DTC Badge)：</span> <span id="art-dtc-text"></span>
                </div>

                <!-- Article Body / Description -->
                <div class="space-y-4 text-slate-700 leading-relaxed text-sm mb-8">
                    <h3 class="font-bold text-slate-900 text-base">【案例詳細文字描述與解構】</h3>
                    <p id="art-desc" class="bg-white p-6 rounded border border-slate-200 shadow-sm whitespace-pre-line font-mono text-xs leading-6 text-slate-800">
                        <!-- Description -->
                    </p>
                </div>

                <!-- Embedded PDF Report Section -->
                <div class="mt-8 border-t border-slate-300 pt-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="font-bold text-slate-900 text-base flex items-center space-x-2">
                            <span>📄 雲端 PDF 原始技術報告檢視</span>
                        </h3>
                        <a id="art-pdf-link" href="#" target="_blank" class="text-xs bg-slate-900 hover:bg-amber-600 text-white px-3 py-1.5 rounded transition font-mono">
                            在新視窗開啟 PDF ➔
                        </a>
                    </div>
                    <!-- PDF Iframe Reader -->
                    <div class="w-full h-[600px] border border-slate-300 rounded bg-white shadow-inner overflow-hidden">
                        <iframe id="art-pdf-iframe" class="w-full h-full" src=""></iframe>
                    </div>
                </div>

            </div>
        </main>

    </div>

    <!-- JavaScript Data Fetcher & Controller -->
    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSw0kBqYIQbAPsmha3HSVyRRgzjVxocLJxCOk2exxsJwo-qv0QLNUENzThS07cRx4AYNDF4n5s-xMjE/pub?output=csv";
        
        let dbData = [];
        let currentFilter = '全部';
        let currentSearchQuery = '';

        // Fetch CSV data from Google Sheets automatically
        async function loadSheetData() {
            try {
                const response = await fetch(CSV_URL);
                const text = await response.text();
                parseCSV(text);
            } catch (error) {
                console.error("載入試算表失敗:", error);
                document.getElementById('case-list-container').innerHTML = `<div class="p-8 text-center text-red-400 text-sm">無法讀取 CBS 雲端資料，請檢查網路連線。</div>`;
            }
        }

        // Simple CSV parser supporting quotes
        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            
            // Assuming row 0 is header: 車型代碼, 部位名稱, 案例標題, 高亮故障碼標籤 (DTC Badge), 案例詳細文字描述, 雲端 PDF 報告網址, 建立時間
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // Basic CSV row splitter considering potential quotes
                const row = [];
                let inQuote = false;
                let currentVal = '';
                for (let char of line) {
                    if (char === '"') {
                        inQuote = !inQuote;
                    } else if (char === ',' && !inQuote) {
                        row.push(currentVal.trim());
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                row.push(currentVal.trim());

                if (row.length >= 7) {
                    result.push({
                        id: i.toString(),
                        car_model: row[0].replace(/^"|"$/g, ''),
                        part_name: row[1].replace(/^"|"$/g, ''),
                        title: row[2].replace(/^"|"$/g, ''),
                        dtc: row[3].replace(/^"|"$/g, ''),
                        description: row[4].replace(/^"|"$/g, ''),
                        pdf_url: row[5].replace(/^"|"$/g, ''),
                        date: row[6].replace(/^"|"$/g, '')
                    });
                }
            }

            dbData = result;
            initTags();
            renderList();
        }

        // Generate dynamic part tags based on data
        function initTags() {
            const parts = ['全部', ...new Set(dbData.map(item => item.part_name).filter(Boolean))];
            const tagContainer = document.getElementById('tag-filters');
            tagContainer.innerHTML = '';
            
            parts.forEach(part => {
                const count = part === '全部' ? dbData.length : dbData.filter(i => i.part_name === part).length;
                const btn = document.createElement('button');
                btn.className = `tag-btn text-xs px-2.5 py-1 rounded transition ${part === currentFilter ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40 font-medium' : 'bg-[#1a1e29] text-slate-400 border border-[#2a3243] hover:border-slate-600'}`;
                btn.innerText = `${part} (${count})`;
                btn.onclick = () => filterByPart(part);
                tagContainer.appendChild(btn);
            });
        }

        function renderList() {
            const container = document.getElementById('case-list-container');
            container.innerHTML = '';

            const filtered = dbData.filter(item => {
                const matchPart = (currentFilter === '全部' || item.part_name === currentFilter);
                const query = currentSearchQuery.toLowerCase();
                const matchSearch = item.car_model.toLowerCase().includes(query) ||
                                    item.part_name.toLowerCase().includes(query) ||
                                    item.title.toLowerCase().includes(query) ||
                                    item.dtc.toLowerCase().includes(query) ||
                                    item.description.toLowerCase().includes(query);
                return matchPart && matchSearch;
            });

            document.getElementById('total-count').innerText = `文章總計: ${filtered.length} 篇`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-500 text-sm">沒有找到符合的文章紀錄</div>`;
                return;
            }

            filtered.forEach((item) => {
                const div = document.createElement('div');
                div.className = `p-4 cursor-pointer transition hover:bg-[#181d28] border-l-2 border-transparent`;
                div.onclick = () => selectArticle(item.id, div);
                
                div.innerHTML = `
                    <div class="flex items-center justify-between mb-1.5">
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] mono-font bg-[#1a1e29] text-amber-400 px-2 py-0.5 rounded border border-amber-500/25">${item.car_model}</span>
                            <span class="text-[10px] bg-[#1f2430] text-slate-300 px-2 py-0.5 rounded">${item.part_name}</span>
                        </div>
                        <span class="text-[11px] text-slate-500 mono-font">${item.date}</span>
                    </div>
                    <h2 class="text-xs font-medium text-slate-200 line-clamp-2 leading-relaxed mb-1">${item.title}</h2>
                    ${item.dtc ? `<div class="text-[11px] mono-font text-red-400 bg-red-950/30 px-2 py-0.5 rounded inline-block mt-1 border border-red-900/30">DTC: ${item.dtc}</div>` : ''}
                `;
                container.appendChild(div);
            });
        }

        function filterByPart(part) {
            currentFilter = part;
            initTags();
            renderList();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            currentSearchQuery = e.target.value;
            renderList();
        });

        function selectArticle(id, element) {
            document.querySelectorAll('#case-list-container > div').forEach(el => {
                el.classList.remove('bg-[#1a202c]', 'border-l-amber-500');
                el.classList.add('border-l-transparent');
            });
            element.classList.add('bg-[#1a202c]', 'border-l-amber-500');
            element.classList.remove('border-l-transparent');

            const item = dbData.find(d => d.id === id);
            if (!item) return;

            document.getElementById('empty-state').classList.add('hidden');
            const artContainer = document.getElementById('article-container');
            artContainer.classList.remove('hidden');

            document.getElementById('art-meta-tag').innerText = `${item.car_model} / ${item.part_name}`;
            document.getElementById('art-meta-date').innerText = item.date;
            document.getElementById('art-title').innerText = item.title;
            
            const dtcBox = document.getElementById('art-dtc-box');
            if(item.dtc) {
                dtcBox.classList.remove('hidden');
                document.getElementById('art-dtc-text').innerText = item.dtc;
            } else {
                dtcBox.classList.add('hidden');
            }

            document.getElementById('art-desc').innerText = item.description;

            // Convert Google Drive view URL to preview format if needed
            let pdfUrl = item.pdf_url;
            if (pdfUrl.includes('/view')) {
                pdfUrl = pdfUrl.replace('/view', '/preview');
            }
            document.getElementById('art-pdf-iframe').src = pdfUrl;
            document.getElementById('art-pdf-link').href = item.pdf_url;
        }

        // Initialize on load
        loadSheetData();
    </script>
</body>
</html>
