<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stellantis 維修實驗室 - 智慧多媒體檢視站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #0f1115; color: #e2e8f0; overflow: hidden; height: 100dvh; position: fixed; width: 100%; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #181b22; }
        ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 2px; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden">

    <!-- Top Header -->
    <header class="bg-[#14171f] border-b border-[#262c38] px-4 py-3 md:py-0 md:h-14 flex flex-col md:flex-row md:items-center md:justify-between shrink-0 space-y-2 md:space-y-0">
        <div class="flex items-center justify-between md:justify-start md:space-x-4">
            <div class="flex items-center space-x-2">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse shrink-0"></span>
                <h1 class="font-bold text-sm md:text-lg tracking-wider text-slate-100 flex items-center space-x-2">
                    <span>Stellantis 維修實驗室</span>
                    <span class="text-[10px] text-amber-400 font-mono border border-amber-500/30 px-1.5 py-0.5 rounded">有功夫無懦夫</span>
                </h1>
            </div>
        </div>
        <div class="flex items-center justify-between md:justify-end space-x-2 text-xs md:text-sm">
            <span class="text-xs text-slate-400 hidden lg:inline">| 透過虛擬與現實交錯，解構未知的真相</span>
            <div class="flex items-center space-x-2">
                <button onclick="loadSheetData()" class="bg-[#1f2430] hover:bg-[#2e3646] text-slate-300 border border-[#2e3646] px-2.5 py-1 rounded transition text-xs">手動同步</button>
                <span class="bg-[#1f2430] text-slate-300 border border-[#2e3646] px-2.5 py-1 rounded text-xs" id="total-count">文章: 載入中...</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative w-full h-full">

        <!-- Mobile Toggle Button -->
        <div class="md:hidden bg-[#161a23] px-4 py-2 border-b border-[#262c38] flex justify-between items-center shrink-0 z-10">
            <span class="text-xs text-amber-400 font-mono" id="mobile-view-title">目前顯示：工單列表</span>
            <button onclick="toggleMobileView()" id="mobile-toggle-btn" class="bg-amber-600 text-slate-950 font-semibold px-3 py-1 rounded text-xs">切換至內容檢視</button>
        </div>

        <!-- Left Sidebar: Filters & Article List -->
        <aside id="sidebar-panel" class="w-full md:w-[420px] lg:w-[450px] bg-[#12151b] border-r border-[#262c38] flex flex-col shrink-0 h-full overflow-hidden">
            <!-- Search & Action Bar (Cleaned up: Part tags moved to popup) -->
            <div class="p-3 md:p-4 border-b border-[#262c38] space-y-2.5 shrink-0">
                <div class="flex items-center space-x-1.5">
                    <div class="relative flex-1">
                        <input type="text" id="search-input" placeholder="搜尋車型、故障碼或手札..." 
                               class="w-full bg-[#1a1e29] border border-[#2a3243] rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-amber-500 transition">
                    </div>
                    <!-- 部位標籤 Toggle Button -->
                    <button onclick="togglePartLibrary()" id="part-lib-btn" class="bg-[#1a1e29] hover:bg-[#2e3646] text-amber-400 border border-[#2a3243] hover:border-amber-500/50 px-2.5 py-2 rounded-lg text-xs font-medium transition flex items-center space-x-1 shrink-0">
                        <span>🏷️ 部位</span>
                    </button>
                    <!-- 症狀標籤庫 Toggle Button -->
                    <button onclick="toggleTagLibrary()" id="tag-lib-btn" class="bg-[#1a1e29] hover:bg-[#2e3646] text-blue-400 border border-[#2a3243] hover:border-blue-500/50 px-2.5 py-2 rounded-lg text-xs font-medium transition flex items-center space-x-1 shrink-0">
                        <span>🏷️ 症狀</span>
                    </button>
                </div>
                
                <!-- Car Model Filter -->
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-400 shrink-0 font-mono">車型：</span>
                    <select id="car-model-select" onchange="filterByCarModel(this.value)" class="w-full bg-[#1a1e29] border border-[#2a3243] rounded px-2 py-1.5 text-xs text-amber-400 font-mono focus:outline-none focus:border-amber-500">
                        <option value="全部">全部車型</option>
                    </select>
                </div>
            </div>

            <!-- List of Articles -->
            <div class="flex-1 overflow-y-auto divide-y divide-[#1f2430] pb-36 overscroll-contain" id="case-list-container">
                <div class="p-8 text-center text-slate-500 text-sm">正在從 CBS 雲端同步資料...</div>
            </div>
        </aside>

        <!-- Part Tags Modal / Overlay Panel -->
        <div id="part-library-panel" class="hidden absolute top-24 md:top-4 left-4 z-50 w-80 md:w-96 bg-[#161a23] border border-[#2e3646] rounded-xl shadow-2xl p-4 space-y-3 backdrop-blur-md bg-opacity-95">
            <div class="flex items-center justify-between border-b border-[#262c38] pb-2">
                <h3 class="text-sm font-bold text-amber-400 flex items-center space-x-1.5">
                    <span>🏷️ 維修部位篩選 (Part Filter)</span>
                </h3>
                <button onclick="togglePartLibrary()" class="text-slate-400 hover:text-white text-xs px-2 py-1 rounded bg-[#1f2430]">✕ 關閉</button>
            </div>
            <div class="flex items-center justify-between text-xs text-slate-400">
                <span id="active-part-status">目前選擇：全部部位</span>
                <button onclick="filterByPart('全部')" class="text-amber-400 hover:underline font-mono">重設部位</button>
            </div>
            <div class="flex flex-wrap gap-1.5 max-h-60 overflow-y-auto p-1 bg-[#10131a] rounded border border-[#222736]" id="part-tag-cloud"></div>
        </div>

        <!-- Symptom Style Tag Library Modal / Overlay Panel -->
        <div id="tag-library-panel" class="hidden absolute top-24 md:top-4 left-24 z-50 w-80 md:w-96 bg-[#161a23] border border-[#2e3646] rounded-xl shadow-2xl p-4 space-y-3 backdrop-blur-md bg-opacity-95">
            <div class="flex items-center justify-between border-b border-[#262c38] pb-2">
                <h3 class="text-sm font-bold text-blue-400 flex items-center space-x-1.5">
                    <span>🏷️ 症狀標籤庫 (Vault Tags)</span>
                </h3>
                <button onclick="toggleTagLibrary()" class="text-slate-400 hover:text-white text-xs px-2 py-1 rounded bg-[#1f2430]">✕ 關閉</button>
            </div>
            <div class="flex items-center justify-between text-xs text-slate-400">
                <span id="active-tag-status">點擊標籤進行過濾</span>
                <button onclick="clearSymptomFilter()" id="clear-symptom-btn" class="hidden text-blue-400 hover:underline font-mono">清除篩選</button>
            </div>
            <div class="flex flex-wrap gap-1.5 max-h-60 overflow-y-auto p-1 bg-[#10131a] rounded border border-[#222736]" id="symptom-tag-cloud"></div>
        </div>

        <!-- Right Content: Smart Viewer (PDF or YouTube) -->
        <main id="reader-panel" class="hidden md:flex flex-1 bg-[#090b0e] flex-col relative h-full overflow-hidden">
            
            <!-- Default Empty State -->
            <div id="empty-state" class="m-auto text-center space-y-3 p-6 md:p-8">
                <div class="w-16 h-16 rounded-full bg-[#161a23] border border-[#262c38] flex items-center justify-center mx-auto text-amber-400 text-2xl font-mono">⚡</div>
                <h2 class="text-slate-200 font-medium text-sm md:text-base">請從左側列表選取一篇維修案例</h2>
                <p class="text-slate-500 text-xs md:text-sm max-w-md">右側將自動辨識並滿版加載 PDF 報告或 YouTube 影片。</p>
            </div>

            <!-- Viewer Header Bar -->
            <div id="pdf-header" class="hidden h-12 bg-[#14171f] border-b border-[#262c38] px-4 md:px-6 flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <span class="text-xs uppercase tracking-wider text-amber-500 font-mono font-semibold shrink-0" id="pdf-car-tag">-</span>
                    <span class="text-slate-600">/</span>
                    <span class="text-xs md:text-sm font-medium text-slate-200 truncate" id="pdf-title-text">-</span>
                </div>
                <a id="external-link" href="#" target="_blank" class="text-xs bg-[#1f2430] hover:bg-amber-600 hover:text-slate-950 text-slate-300 px-3 py-1.5 rounded border border-[#2e3646] transition flex items-center space-x-1 shrink-0 font-mono">
                    <span id="external-link-text">在新視窗開啟 ↗</span>
                </a>
            </div>

            <!-- PDF Iframe Canvas -->
            <div class="flex-1 bg-white relative w-full h-full hidden" id="pdf-container">
                <iframe id="pdf-iframe" class="w-full h-full border-0" src=""></iframe>
            </div>

            <!-- YouTube Embedded Canvas -->
            <div class="flex-1 bg-black relative w-full h-full hidden flex-col items-center justify-center p-6" id="youtube-container">
                <div class="w-full max-w-4xl aspect-video bg-[#14171f] rounded-lg overflow-hidden border border-[#262c38] shadow-2xl">
                    <iframe id="youtube-iframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
        </main>

    </div>

    <!-- JavaScript Controller -->
    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSw0kBqYIQbAPsmha3HSVyRRgzjVxocLJxCOk2exxsJwo-qv0QLNUENzThS07cRx4AYNDF4n5s-xMjE/pub?gid=213514790&single=true&output=csv";
        
        let dbData = [];
        let currentCarFilter = '全部';
        let currentPartFilter = '全部';
        let currentSymptomFilter = null;
        let currentSearchQuery = '';
        let mobileViewMode = 'list';

        async function loadSheetData() {
            try {
                document.getElementById('case-list-container').innerHTML = `<div class="p-8 text-center text-slate-400 text-sm animate-pulse">正在手動同步 CBS 雲端資料與標籤庫...</div>`;
                const response = await fetch(CSV_URL);
                const text = await response.text();
                parseCSV(text);
            } catch (error) {
                console.error("載入試算表失敗:", error);
                document.getElementById('case-list-container').innerHTML = `<div class="p-8 text-center text-red-400 text-sm">無法讀取 CBS 雲端資料。<br>請確認透過本地伺服器或線上環境運行。</div>`;
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const row = [];
                let inQuote = false;
                let currentVal = '';
                for (let char of line) {
                    if (char === '"') {
                        inQuote = !inQuote;
                    } else if (char === ',' && !inQuote) {
                        row.push(currentVal.trim());
                        currentVal = '';
                    } else {
                        currentVal += char;
                    }
                }
                row.push(currentVal.trim());

                if (row.length >= 7) {
                    result.push({
                        id: i.toString(),
                        car_model: (row[0] || '').replace(/^"|"$/g, ''),
                        part_name: (row[1] || '').replace(/^"|"$/g, ''),
                        title: (row[2] || '').replace(/^"|"$/g, ''),
                        dtc: (row[3] || '').replace(/^"|"$/g, ''),
                        symptoms: (row[4] || '').replace(/^"|"$/g, ''),
                        description: (row[5] || '').replace(/^"|"$/g, ''),
                        pdf_url: (row[6] || '').replace(/^"|"$/g, ''),
                        date: (row[7] || '').replace(/^"|"$/g, '')
                    });
                }
            }

            result.sort((a, b) => new Date(b.date) - new Date(a.date));

            dbData = result;
            initCarModelDropdown();
            initPartCloud();
            initSymptomCloud();
            renderList();
        }

        function toggleTagLibrary() {
            const panel = document.getElementById('tag-library-panel');
            const partPanel = document.getElementById('part-library-panel');
            partPanel.classList.add('hidden');
            panel.classList.toggle('hidden');
        }

        function togglePartLibrary() {
            const panel = document.getElementById('part-library-panel');
            const tagPanel = document.getElementById('tag-library-panel');
            tagPanel.classList.add('hidden');
            panel.classList.toggle('hidden');
        }

        function toggleMobileView() {
            const sidebar = document.getElementById('sidebar-panel');
            const reader = document.getElementById('reader-panel');
            const btn = document.getElementById('mobile-toggle-btn');
            const title = document.getElementById('mobile-view-title');

            if (mobileViewMode === 'list') {
                sidebar.classList.add('hidden');
                reader.classList.remove('hidden');
                reader.classList.add('flex');
                btn.innerText = "返回列表";
                title.innerText = "目前顯示：內容檢視";
                mobileViewMode = 'reader';
            } else {
                reader.classList.remove('flex');
                reader.classList.add('hidden');
                sidebar.classList.remove('hidden');
                btn.innerText = "切換至內容檢視";
                title.innerText = "目前顯示：工單列表";
                mobileViewMode = 'list';
            }
        }

        function initCarModelDropdown() {
            const cars = [...new Set(dbData.map(item => item.car_model).filter(Boolean))];
            const select = document.getElementById('car-model-select');
            select.innerHTML = `<option value="全部">全部車型 (${dbData.length})</option>`;
            
            cars.forEach(car => {
                const count = dbData.filter(i => i.car_model === car).length;
                const opt = document.createElement('option');
                opt.value = car;
                opt.innerText = `${car} (${count})`;
                if (car === currentCarFilter) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function initPartCloud() {
            const filteredByCar = currentCarFilter === '全部' ? dbData : dbData.filter(i => i.car_model === currentCarFilter);
            const parts = ['全部', ...new Set(filteredByCar.map(item => item.part_name).filter(Boolean))];
            const partCloud = document.getElementById('part-tag-cloud');
            partCloud.innerHTML = '';
            
            parts.forEach(part => {
                const count = part === '全部' ? filteredByCar.length : filteredByCar.filter(i => i.part_name === part).length;
                const isSelected = (currentPartFilter === part);
                
                const btn = document.createElement('button');
                btn.className = `text-[11px] px-2.5 py-1 rounded-md transition font-mono flex items-center justify-between ${isSelected ? 'bg-amber-500 text-slate-950 font-bold shadow' : 'bg-[#1f2430] text-amber-400 hover:bg-[#2a3243] border border-amber-900/30'}`;
                btn.innerHTML = `<span>${part}</span> <span class="text-[9px] opacity-75">(${count})</span>`;
                btn.onclick = () => {
                    filterByPart(part);
                    togglePartLibrary();
                };
                partCloud.appendChild(btn);
            });

            document.getElementById('active-part-status').innerText = `目前選擇：${currentPartFilter}`;
        }

        function initSymptomCloud() {
            const symptomCloud = document.getElementById('symptom-tag-cloud');
            symptomCloud.innerHTML = '';

            let symptomCounts = {};
            dbData.forEach(item => {
                if (item.symptoms) {
                    item.symptoms.split('/').forEach(s => {
                        const cleanS = s.trim();
                        if (cleanS) {
                            symptomCounts[cleanS] = (symptomCounts[cleanS] || 0) + 1;
                        }
                    });
                }
            });

            const uniqueSymptoms = Object.keys(symptomCounts);
            if (uniqueSymptoms.length === 0) {
                symptomCloud.innerHTML = `<div class="p-2 text-xs text-slate-500 italic">尚無症狀標籤資料</div>`;
                return;
            }

            uniqueSymptoms.forEach(sym => {
                const isSelected = (currentSymptomFilter === sym);
                const tag = document.createElement('button');
                tag.className = `text-[11px] px-2.5 py-1 rounded-md transition font-mono flex items-center justify-between ${isSelected ? 'bg-blue-600 text-white font-bold shadow' : 'bg-[#1f2430] text-blue-400 hover:bg-[#2a3243] border border-blue-900/30'}`;
                tag.innerHTML = `<span>#${sym}</span> <span class="text-[9px] opacity-75">(${symptomCounts[sym]})</span>`;
                tag.onclick = () => {
                    filterBySymptom(sym);
                    toggleTagLibrary();
                };
                symptomCloud.appendChild(tag);
            });

            const clearBtn = document.getElementById('clear-symptom-btn');
            const statusText = document.getElementById('active-tag-status');
            if (currentSymptomFilter) {
                clearBtn.classList.remove('hidden');
                statusText.innerHTML = `目前篩選：<span class="text-blue-400 font-bold">#${currentSymptomFilter}</span>`;
            } else {
                clearBtn.classList.add('hidden');
                statusText.innerHTML = `點擊標籤進行過濾`;
            }
        }

        function filterByCarModel(car) {
            currentCarFilter = car;
            currentPartFilter = '全部';
            initPartCloud();
            renderList();
        }

        function filterByPart(part) {
            currentPartFilter = part;
            initPartCloud();
            renderList();
        }

        function filterBySymptom(sym) {
            currentSymptomFilter = (currentSymptomFilter === sym) ? null : sym;
            initSymptomCloud();
            renderList();
        }

        function clearSymptomFilter() {
            currentSymptomFilter = null;
            initSymptomCloud();
            renderList();
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            currentSearchQuery = e.target.value;
            renderList();
        });

        function renderList() {
            const container = document.getElementById('case-list-container');
            container.innerHTML = '';

            const filtered = dbData.filter(item => {
                const matchCar = (currentCarFilter === '全部' || item.car_model === currentCarFilter);
                const matchPart = (currentPartFilter === '全部' || item.part_name === currentPartFilter);
                
                let matchSymptom = true;
                if (currentSymptomFilter) {
                    const itemSyms = item.symptoms ? item.symptoms.split('/').map(s => s.trim()) : [];
                    matchSymptom = itemSyms.includes(currentSymptomFilter);
                }

                const query = currentSearchQuery.toLowerCase();
                const matchSearch = item.car_model.toLowerCase().includes(query) ||
                                    item.part_name.toLowerCase().includes(query) ||
                                    item.title.toLowerCase().includes(query) ||
                                    item.dtc.toLowerCase().includes(query) ||
                                    item.symptoms.toLowerCase().includes(query) ||
                                    item.description.toLowerCase().includes(query);

                return matchCar && matchPart && matchSymptom && matchSearch;
            });

            document.getElementById('total-count').innerText = `文章: ${filtered.length} 篇`;

            if (filtered.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-500 text-sm">沒有找到符合的文章紀錄</div>`;
                return;
            }

            filtered.forEach((item) => {
                const div = document.createElement('div');
                div.className = `p-3 md:p-4 cursor-pointer transition hover:bg-[#181d28] border-l-2 border-transparent`;
                div.onclick = () => selectArticle(item.id, div);
                
                let dtcHtml = '';
                if (item.dtc) {
                    const dtcList = item.dtc.split('/').map(s => s.trim()).filter(Boolean);
                    dtcHtml = `<div class="flex flex-wrap gap-1 mt-1">` + 
                              dtcList.map(code => `<span class="text-[9px] mono-font text-red-400 bg-red-950/30 px-2 py-0.5 rounded border border-red-900/30">DTC: ${code}</span>`).join('') +
                              `</div>`;
                }

                let symHtml = '';
                if (item.symptoms) {
                    const symList = item.symptoms.split('/').map(s => s.trim()).filter(Boolean);
                    symHtml = `<div class="flex flex-wrap gap-1 mt-1">` + 
                              symList.map(s => `<span class="text-[9px] mono-font text-blue-400 bg-blue-950/30 px-2 py-0.5 rounded border border-blue-900/30">#${s}</span>`).join('') +
                              `</div>`;
                }

                div.innerHTML = `
                    <div class="flex items-center justify-between mb-1.5">
                        <div class="flex items-center space-x-2">
                            <span class="text-[10px] mono-font bg-[#1a1e29] text-amber-400 px-2 py-0.5 rounded border border-amber-500/25">${item.car_model}</span>
                            <span class="text-[10px] bg-[#1f2430] text-slate-300 px-2 py-0.5 rounded">${item.part_name}</span>
                        </div>
                        <span class="text-[11px] text-slate-500 mono-font">${item.date}</span>
                    </div>
                    <h2 class="text-xs font-medium text-slate-200 line-clamp-2 leading-relaxed mb-1">${item.title}</h2>
                    ${dtcHtml}
                    ${symHtml}
                `;
                container.appendChild(div);
            });
        }

        function selectArticle(id, element) {
            document.querySelectorAll('#case-list-container > div').forEach(el => {
                el.classList.remove('bg-[#1a202c]', 'border-l-amber-500');
                el.classList.add('border-l-transparent');
            });
            element.classList.add('bg-[#1a202c]', 'border-l-amber-500');
            element.classList.remove('border-l-transparent');

            const item = dbData.find(d => d.id === id);
            if (!item) return;

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('pdf-header').classList.remove('hidden');

            document.getElementById('pdf-car-tag').innerText = `${item.car_model} / ${item.part_name}`;
            document.getElementById('pdf-title-text').innerText = item.title;

            const url = item.pdf_url;
            const pdfContainer = document.getElementById('pdf-container');
            const youtubeContainer = document.getElementById('youtube-container');
            const externalLink = document.getElementById('external-link');
            const externalLinkText = document.getElementById('external-link-text');

            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                pdfContainer.classList.add('hidden');
                youtubeContainer.classList.remove('hidden');
                youtubeContainer.classList.add('flex');

                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1].split('&')[0];
                }

                document.getElementById('youtube-iframe').src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
                externalLink.href = url;
                externalLinkText.innerText = "在 YouTube 觀看 ↗";
            } else {
                youtubeContainer.classList.add('hidden');
                pdfContainer.classList.remove('hidden');
                pdfContainer.classList.add('flex');

                let pdfUrl = url;
                if (pdfUrl.includes('/view')) {
                    pdfUrl = pdfUrl.replace('/view', '/preview');
                }
                document.getElementById('pdf-iframe').src = pdfUrl;
                externalLink.href = url;
                externalLinkText.innerText = "在新視窗開啟 ↗";
            }

            if (window.innerWidth < 768 && mobileViewMode === 'list') {
                toggleMobileView();
            }
        }

        loadSheetData();
    </script>
</body>
</html>
