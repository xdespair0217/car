<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Stellantis 解碼器 (DiagBox Decoder)</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: #13141a;
            --text-main: #a9b1d6;
            --accent-cyan: #7dcfff;
            --accent-amber: #e0af68;
            --border: #292e42;
            --danger: #f7768e;
            --highlight: rgba(125, 207, 255, 0.1);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 30px;
        }
        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .header h1 {
            color: var(--accent-cyan);
            font-size: 1.8rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: var(--border);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .btn-export {
            background-color: #1a1b26;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 8px 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-export:hover {
            background-color: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 10px rgba(125, 207, 255, 0.3);
        }
        .drop-zone {
            border: 2px dashed var(--border);
            padding: 50px;
            text-align: center;
            background-color: var(--panel-bg);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1.5px;
            font-size: 1.1rem;
            border-radius: 8px;
        }
        .drop-zone:hover {
            border-color: var(--accent-amber);
            color: var(--accent-amber);
            box-shadow: 0 0 20px rgba(224, 175, 104, 0.15);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 12px 15px;
            text-align: left;
        }
        th {
            background-color: #1a1b26;
            color: var(--accent-cyan);
            position: sticky;
            top: 0;
            z-index: 10;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        tr:hover { background-color: var(--highlight); }
        .meta-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--panel-bg);
            border-left: 4px solid var(--accent-amber);
            border-radius: 0 8px 8px 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .meta-item { font-size: 1rem; font-weight: bold;}
        .meta-key { color: var(--accent-amber); margin-right: 8px; font-weight: normal;}
        .table-container {
            overflow-x: auto;
            max-height: 70vh;
            border: 1px solid var(--border);
            border-radius: 8px;
            background-color: var(--panel-bg);
        }
        ::-webkit-scrollbar { height: 10px; width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); border-radius: 5px;}
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px;}
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }
        
        .fault-code { color: var(--danger); font-weight: bold; }
        .fault-desc { color: #c0caf5; max-width: 400px; white-space: normal; }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>STELLANTIS 解碼器</h1>
        <div style="margin-top:5px; font-size: 0.9rem; color: #565f89;">[ 訊號解構與時空校準系統 ]</div>
    </div>
    <div style="text-align: right;">
        <div class="subtitle">v1.2 | Observer: Soros</div>
        <button id="exportBtn" class="btn-export" style="display: none;" onclick="exportTableToCSV()">匯出 EXCEL (CSV)</button>
    </div>
</div>

<div class="drop-zone" id="dropZone">
    [ 點擊或拖曳 DiagBox CSV 至此進行解碼 ]
</div>
<input type="file" id="fileInput" accept=".csv" style="display: none;">

<div id="output" style="display: none;">
    <div class="meta-container" id="metaInfo"></div>
    <div class="table-container">
        <table id="dataTable">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const dict = {
        "appearance": "出現標記",
        "disappearance": "消失標記",
        "date time": "系統時間 (+6h校準)",
        "Accuracy of the contexts": "環境準確度",
        "distance (km)": "行駛里程 (km)",
        "control unit": "控制單元",
        "emergency mode": "緊急模式",
        "Fault code": "故障碼",
        "fault description": "故障描述",
        "Engine speed": "引擎轉速 (RPM)",
        "exterior temperature": "車外溫度 (°C)",
        "vehicle speed": "車速 (km/h)",
        "lateral acceleration": "橫向加速度",
        "longitudinal acceleration": "縱向加速度",
        "STEERING WHEEL ANGLE": "方向盤角度",
        "Voltage of the ancillaries battery": "輔助電瓶電壓 (V)",
        "Ancillaries battery charge status": "電瓶充電狀態",
        "presence of driver": "駕駛員偵測",
        "ECO mode": "節能模式",
        "status of the electrical network": "電網狀態",
        "braking in progress": "煞車作動",
        "filtered fuel level": "燃油液位",
        "drive train type": "驅動類型",
        "vehicle mileage": "進場里程",
        "Accessory positive relay control": "ACC 繼電器",
        "Ignition positive relay control": "IGN 繼電器",
        "Windscreen wiping control position": "雨刷控制位置",
        "traction battery charge level": "動力電池電量",
        "date": "Date",
        "time": "Time",
        "Vehicle": "Vehicle",
        "VIN": "VIN",
        "Fault": "Fault",
        "Log full": "Log full",
        "number of faults": "Number of faults"
    };

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = "var(--accent-amber)"; });
    dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = "var(--border)");
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.borderColor = "var(--border)";
        if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) processFile(e.target.files[0]);
    });

    function processFile(file) {
        const reader = new FileReader();
        reader.onload = e => parseCSV(e.target.result);
        reader.readAsText(file, 'latin1'); 
    }

    function parseCSV(text) {
        const separator = text.indexOf(';') !== -1 ? ';' : ',';
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        
        let metaHtml = "";
        let headerIndex = -1;

        for (let i = 0; i < lines.length; i++) {
            let lineLower = lines[i].toLowerCase();
            if (lineLower.includes('appearance') && (lineLower.includes('fault code') || lineLower.includes('date time'))) {
                headerIndex = i;
                break;
            }
        }

        if (headerIndex === -1) {
            alert("[解析失敗] 無法辨識的矩陣結構，請確認是否為 DiagBox 標準輸出格式。");
            return;
        }

        for (let i = 0; i < headerIndex; i++) {
            let parts = lines[i].split(separator);
            if (parts.length >= 2 && parts[0]) {
                let keyRaw = parts[0].replace(/^"|"$/g, '').trim();
                let val = parts[1].replace(/^"|"$/g, '').trim();
                let keyClean = keyRaw.replace(/\s+$/, '');
                let translatedKey = dict[keyClean] || dict[keyClean.toLowerCase()] || keyClean;
                
                if(keyClean) {
                    metaHtml += `<div class="meta-item"><span class="meta-key">[${translatedKey}]</span> <span class="meta-val">${val}</span></div>`;
                }
            }
        }
        document.getElementById('metaInfo').innerHTML = metaHtml;

        let rawHeaders = lines[headerIndex].split(separator).map(h => h.replace(/^"|"$/g, '').trim());
        let tableHead = document.getElementById('tableHead');
        tableHead.innerHTML = "";
        
        let faultCodeIndex = -1;
        let faultDescIndex = -1;

        rawHeaders.forEach((header, index) => {
            if (!header) return;
            let headerLower = header.toLowerCase();
            if (headerLower === 'fault code') faultCodeIndex = index;
            if (headerLower === 'fault description') faultDescIndex = index;

            let translated = dict[header] || dict[headerLower] || header;
            let th = document.createElement('th');
            th.innerText = translated;
            tableHead.appendChild(th);
        });

        let tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";
        
        for (let i = headerIndex + 1; i < lines.length; i++) {
            let cols = [];
            let inQuotes = false;
            let currentVal = '';
            
            for (let char of lines[i]) {
                if (char === '"' && inQuotes) {
                    inQuotes = false;
                } else if (char === '"' && !inQuotes) {
                    inQuotes = true;
                } else if (char === separator && !inQuotes) {
                    cols.push(currentVal);
                    currentVal = '';
                } else {
                    currentVal += char;
                }
            }
            cols.push(currentVal); 

            if (cols.length < 5) continue; 
            
            let tr = document.createElement('tr');
            
            for(let j = 0; j < rawHeaders.length; j++) {
                if(!rawHeaders[j]) continue;
                let val = cols[j] ? cols[j].replace(/^"|"$/g, '').trim() : "";
                let headerName = rawHeaders[j].toLowerCase();
                
                if (headerName === "date time" && val) val = adjustTime(val, 6);

                let td = document.createElement('td');
                td.innerText = val;
                
                if (j === faultCodeIndex) td.className = 'fault-code';
                if (j === faultDescIndex) td.className = 'fault-desc';
                
                tr.appendChild(td);
            }
            tableBody.appendChild(tr);
        }

        document.getElementById('dropZone').style.display = 'none';
        document.getElementById('output').style.display = 'block';
        document.getElementById('exportBtn').style.display = 'inline-block';
    }

    function adjustTime(timeStr, addHours) {
        try {
            let parts = timeStr.trim().split(' ');
            if (parts.length < 2) return timeStr;
            let dateParts = parts[0].split('/');
            let timeParts = parts[1].split(':');
            
            if (dateParts.length === 3 && timeParts.length >= 2) {
                let year = parseInt(dateParts[2], 10);
                let month = parseInt(dateParts[1], 10) - 1; 
                let day = parseInt(dateParts[0], 10);
                let hour = parseInt(timeParts[0], 10);
                let min = parseInt(timeParts[1], 10);
                
                let secParts = timeParts[2] ? timeParts[2].split('.') : ['0'];
                let sec = parseInt(secParts[0], 10) || 0;
                
                let dateObj = new Date(year, month, day, hour, min, sec);
                if (isNaN(dateObj.getTime())) return timeStr;

                dateObj.setHours(dateObj.getHours() + addHours); 
                
                let y = dateObj.getFullYear();
                let m = String(dateObj.getMonth() + 1).padStart(2, '0');
                let d = String(dateObj.getDate()).padStart(2, '0');
                let H = String(dateObj.getHours()).padStart(2, '0');
                let M = String(dateObj.getMinutes()).padStart(2, '0');
                let S = String(dateObj.getSeconds()).padStart(2, '0');
                return `${y}/${m}/${d} ${H}:${M}:${S}`;
            }
            return timeStr;
        } catch (e) {
            return timeStr; 
        }
    }

    // 將解構完畢的矩陣封裝回 Excel 可讀格式
    function exportTableToCSV() {
        let csv = [];
        
        // 1. 寫入 Meta 頂部資訊 (水平排列方便 Excel 檢視)
        let metaKeysRow = [];
        let metaValsRow = [];
        const metaItems = document.querySelectorAll('.meta-item');
        metaItems.forEach(item => {
            let keyText = item.querySelector('.meta-key').innerText.replace(/[\[\]]/g, '').trim();
            let valText = item.querySelector('.meta-val').innerText.trim();
            metaKeysRow.push('"' + keyText + '"');
            metaValsRow.push('"' + valText + '"');
        });
        if(metaKeysRow.length > 0) {
            csv.push(metaKeysRow.join(","));
            csv.push(metaValsRow.join(","));
            csv.push(""); // 空行分隔
        }

        // 2. 寫入主體資料表
        const rows = document.querySelectorAll("#dataTable tr");
        for (let i = 0; i < rows.length; i++) {
            let row = [];
            let cols = rows[i].querySelectorAll("td, th");
            for (let j = 0; j < cols.length; j++) {
                // 處理雙引號跳脫
                let data = cols[j].innerText.replace(/"/g, '""');
                row.push('"' + data + '"');
            }
            csv.push(row.join(","));
        }

        // 3. 觸發下載 (加入 BOM 以防止 Excel 中文亂碼)
        let csvContent = "\uFEFF" + csv.join("\n");
        let csvFile = new Blob([csvContent], {type: "text/csv;charset=utf-8;"});
        
        let downloadLink = document.createElement("a");
        let now = new Date();
        let timestamp = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}`;
        
        downloadLink.download = `Stellantis_Decoded_${timestamp}.csv`;
        downloadLink.href = window.URL.createObjectURL(csvFile);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    }
</script>
</body>
</html>
