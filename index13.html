<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Stellantis 解碼器 (DiagBox Decoder)</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: #13141a;
            --text-main: #a9b1d6;
            --accent-cyan: #7dcfff;
            --accent-amber: #e0af68;
            --border: #292e42;
            --danger: #f7768e;
            --highlight: rgba(125, 207, 255, 0.1);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 30px;
        }
        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .header h1 {
            color: var(--accent-cyan);
            font-size: 1.8rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: var(--border);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background-color: #1a1b26;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 8px 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            background-color: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 10px rgba(125, 207, 255, 0.3);
        }
        .btn-amber { color: var(--accent-amber); border-color: var(--accent-amber); }
        .btn-amber:hover { background-color: var(--accent-amber); color: #000; box-shadow: 0 0 10px rgba(224, 175, 104, 0.3); }
        .btn-danger { color: var(--danger); border-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger); color: #000; box-shadow: 0 0 10px rgba(247, 118, 142, 0.3); }
        
        .unit-select {
            background-color: var(--panel-bg);
            color: var(--accent-amber);
            border: 1px solid var(--accent-amber);
            padding: 8px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
            transition: all 0.3s ease;
        }
        .unit-select:focus { box-shadow: 0 0 10px rgba(224, 175, 104, 0.3); }
        .unit-select option { background-color: var(--panel-bg); color: var(--text-main); font-weight: normal; }

        .drop-zone {
            border: 2px dashed var(--border);
            padding: 50px;
            text-align: center;
            background-color: var(--panel-bg);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1.5px;
            font-size: 1.1rem;
            border-radius: 8px;
        }
        .drop-zone:hover {
            border-color: var(--accent-amber);
            color: var(--accent-amber);
            box-shadow: 0 0 20px rgba(224, 175, 104, 0.15);
        }
        
        /* 欄位篩選面板 */
        .column-selector-panel {
            display: none;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            max-height: 250px;
            overflow-y: auto;
        }
        .column-selector-panel.active { display: flex; flex-wrap: wrap; gap: 10px; }
        .col-toggle {
            display: flex; align-items: center; gap: 5px;
            background: #1a1b26; padding: 5px 10px; border-radius: 4px;
            border: 1px solid var(--border); cursor: pointer;
            font-size: 0.85rem; user-select: none; transition: all 0.2s;
        }
        .col-toggle:hover { border-color: var(--accent-cyan); }
        
        /* 分析報告面板 */
        .analysis-panel {
            display: none;
            background: rgba(247, 118, 142, 0.05);
            border: 1px solid var(--danger);
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(247, 118, 142, 0.1);
        }
        .analysis-panel.active { display: block; }
        .analysis-title { color: var(--danger); font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid var(--danger); padding-bottom: 5px; }
        .analysis-content { font-size: 0.95rem; line-height: 1.6; color: #e0e0e0; }
        .analysis-point { margin-bottom: 8px; }
        .analysis-highlight { color: var(--accent-amber); font-weight: bold; }

        table {
            width: 100%; border-collapse: collapse; margin-top: 10px;
            font-size: 0.85rem; white-space: nowrap;
        }
        th, td { border: 1px solid var(--border); padding: 12px 15px; text-align: left; }
        th { background-color: #1a1b26; color: var(--accent-cyan); position: sticky; top: 0; z-index: 10; font-weight: bold; }
        
        .meta-container {
            display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 15px; padding: 20px;
            background: var(--panel-bg); border-left: 4px solid var(--accent-amber); border-radius: 0 8px 8px 0;
        }
        .meta-item { font-size: 1rem; font-weight: bold;}
        .meta-key { color: var(--accent-amber); margin-right: 8px; font-weight: normal;}
        .table-container { overflow-x: auto; max-height: 60vh; border: 1px solid var(--border); border-radius: 8px; background-color: var(--panel-bg); }
        
        ::-webkit-scrollbar { height: 10px; width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); border-radius: 5px;}
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px;}
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }
        
        .fault-code { font-weight: bold; }
        .fault-desc { max-width: 350px; white-space: normal; line-height: 1.4; }
        .desc-en { font-size: 0.75rem; opacity: 0.7; display: block; margin-top: 4px; }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>STELLANTIS 解碼器</h1>
        <div style="margin-top:5px; font-size: 0.9rem; color: #565f89;">[ 訊號解構、色彩拓撲與邏輯診斷 v3.3 ]</div>
    </div>
    <div style="text-align: right;">
        <div class="subtitle">Observer: Soros</div>
        <div class="controls" id="controlsPanel" style="display: none;">
            <select id="unitFilter" class="unit-select" onchange="filterByUnit()" style="display: none;">
                <!-- 動態生成選項 -->
            </select>
            <button id="analyzeBtn" class="btn btn-danger" onclick="runStellantisAnalysis()">深度診斷分析</button>
            <button id="toggleFilterBtn" class="btn btn-amber" onclick="toggleColumnPanel()">過濾欄位 (Filter)</button>
            <button id="exportBtn" class="btn" onclick="exportTableToExcel()">匯出 EXCEL (帶顏色)</button>
        </div>
    </div>
</div>

<div class="drop-zone" id="dropZone">
    [ 點擊或拖曳 DiagBox CSV 至此進行解碼與著色 ]
</div>
<input type="file" id="fileInput" accept=".csv" style="display: none;">

<div id="output" style="display: none;">
    <div class="meta-container" id="metaInfo"></div>
    <div class="analysis-panel" id="analysisPanel">
        <div class="analysis-title">▰ Stellantis 故障拓撲分析報告</div>
        <div class="analysis-content" id="analysisContent"></div>
    </div>
    <div class="column-selector-panel" id="columnSelectorPanel"></div>
    <div class="table-container">
        <table id="dataTable">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>
