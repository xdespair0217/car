<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Stellantis 全方位解碼器 (DiagBox All-in-One Decoder v4.2)</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --panel-bg: #13141a;
            --text-main: #a9b1d6;
            --accent-cyan: #7dcfff;
            --accent-amber: #e0af68;
            --border: #292e42;
            --danger: #f7768e;
            --highlight: rgba(125, 207, 255, 0.1);
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 30px;
        }
        .header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .header h1 {
            color: var(--accent-cyan);
            font-size: 1.8rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .header .subtitle {
            font-size: 0.9rem;
            color: var(--border);
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn {
            background-color: #1a1b26;
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            padding: 8px 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover { background-color: var(--accent-cyan); color: #000; box-shadow: 0 0 10px rgba(125, 207, 255, 0.3); }
        .btn-amber { color: var(--accent-amber); border-color: var(--accent-amber); }
        .btn-amber:hover { background-color: var(--accent-amber); color: #000; box-shadow: 0 0 10px rgba(224, 175, 104, 0.3); }
        .btn-danger { color: var(--danger); border-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger); color: #000; box-shadow: 0 0 10px rgba(247, 118, 142, 0.3); }
        
        .unit-select {
            background-color: var(--panel-bg); color: var(--accent-amber); border: 1px solid var(--accent-amber);
            padding: 8px 12px; font-family: 'Courier New', Courier, monospace; font-size: 0.9rem;
            font-weight: bold; border-radius: 4px; cursor: pointer; outline: none; transition: all 0.3s ease;
        }
        .unit-select:focus { box-shadow: 0 0 10px rgba(224, 175, 104, 0.3); }
        .unit-select option { background-color: var(--panel-bg); color: var(--text-main); font-weight: normal; }

        .drop-zone {
            display: block;
            border: 2px dashed var(--border); padding: 50px; text-align: center;
            background-color: var(--panel-bg); cursor: pointer; transition: all 0.3s ease;
            letter-spacing: 1.5px; font-size: 1.1rem; border-radius: 8px;
            user-select: none;
        }
        .drop-zone:hover { border-color: var(--accent-amber); color: var(--accent-amber); box-shadow: 0 0 20px rgba(224, 175, 104, 0.15); }
        
        .column-selector-panel {
            display: none; background: var(--panel-bg); border: 1px solid var(--border);
            padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            max-height: 250px; overflow-y: auto;
        }
        .column-selector-panel.active { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .col-toggle {
            display: flex; align-items: center; gap: 5px; background: #1a1b26; padding: 5px 10px;
            border-radius: 4px; border: 1px solid var(--border); cursor: pointer; font-size: 0.85rem; user-select: none; transition: all 0.2s;
        }
        .col-toggle:hover { border-color: var(--accent-cyan); }
        .col-toggle-all {
            background: #24283b; border-color: var(--accent-amber); color: var(--accent-amber); font-weight: bold;
        }
        .col-toggle-all:hover { border-color: #fff; color: #fff; }
        
        .analysis-panel {
            display: none; background: rgba(247, 118, 142, 0.05); border: 1px solid var(--danger);
            padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(247, 118, 142, 0.1);
        }
        .analysis-panel.active { display: block; }
        .analysis-title { color: var(--danger); font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid var(--danger); padding-bottom: 5px; }
        .analysis-content { font-size: 0.95rem; line-height: 1.6; color: #e0e0e0; }
        .analysis-point { margin-bottom: 8px; }
        .analysis-highlight { color: var(--accent-amber); font-weight: bold; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; white-space: nowrap; }
        th, td { border: 1px solid var(--border); padding: 12px 15px; text-align: left; }
        th { background-color: #1a1b26; color: var(--accent-cyan); position: sticky; top: 0; z-index: 10; font-weight: bold; }
        
        .meta-container {
            display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 15px; padding: 20px;
            background: var(--panel-bg); border-left: 4px solid var(--accent-amber); border-radius: 0 8px 8px 0;
        }
        .meta-item { font-size: 1rem; font-weight: bold;}
        .meta-key { color: var(--accent-amber); margin-right: 8px; font-weight: normal;}
        .table-container { overflow-x: auto; max-height: 60vh; border: 1px solid var(--border); border-radius: 8px; background-color: var(--panel-bg); }
        
        ::-webkit-scrollbar { height: 10px; width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); border-radius: 5px;}
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px;}
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-cyan); }
        
        .fault-code { font-weight: bold; font-size: 0.95rem; }
        .fault-desc { max-width: 450px; white-space: normal; line-height: 1.4; }
        .desc-en { font-size: 0.75rem; opacity: 0.7; display: block; margin-top: 4px; }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>STELLANTIS 全方位解碼器</h1>
        <div style="margin-top:5px; font-size: 0.9rem; color: #565f89;">[ 支援 CSV / JDD HTML / Nav 日誌 / TU XML 全檔案相容 v4.2 ]</div>
    </div>
    <div style="text-align: right;">
        <div class="subtitle">Observer: Soros</div>
        <div class="controls" id="controlsPanel" style="display: none;">
            <select id="unitFilter" class="unit-select" onchange="filterByUnit()" style="display: none;"></select>
            <button id="analyzeBtn" class="btn btn-danger" onclick="runStellantisAnalysis()">深度診斷分析</button>
            <button id="toggleFilterBtn" class="btn btn-amber" onclick="toggleColumnPanel()">過濾欄位 (Filter)</button>
            <button id="exportBtn" class="btn" onclick="exportTableToExcel()">匯出 EXCEL (帶顏色)</button>
        </div>
    </div>
</div>

<label class="drop-zone" id="dropZone" for="fileInput">
    [ 點擊或拖曳 DiagBox 檔案至此 (支援 .csv / .html / .xml) ]
</label>
<input type="file" id="fileInput" accept=".csv, .html, .htm, .xml" style="display: none;">

<div id="output" style="display: none;">
    <div class="meta-container" id="metaInfo"></div>
    <div class="analysis-panel" id="analysisPanel">
        <div class="analysis-title">▰ Stellantis 故障拓撲分析報告</div>
        <div class="analysis-content" id="analysisContent"></div>
    </div>
    <div class="column-selector-panel" id="columnSelectorPanel"></div>
    <div class="table-container">
        <table id="dataTable">
            <thead><tr id="tableHead"></tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    const dict = {
        "appearance": "出現標記", "disappearance": "消失標記", "date time": "系統時間 (+6h校準)",
        "accuracy of the contexts": "環境準確度", "distance (km)": "行駛里程 (km)",
        "control unit": "控制單元", "emergency mode": "緊急模式", "fault code": "故障碼",
        "fault description": "故障描述", "engine speed": "轉速 (RPM)",
        "engine speed (tr/mn)": "轉速 (RPM)", "exterior temperature": "車外氣溫 (°C)",
        "vehicle speed": "車速 (km/h)", "vehicle speed (km/h)": "車速 (km/h)",
        "voltage of the ancillaries battery": "輔助電瓶電壓 (V)", "battery voltage (v)": "電瓶電壓 (V)",
        "drive train type": "驅動類型", "vehicle mileage": "進場里程",
        "date": "匯出日期", "time": "匯出時間", "vehicle": "車型", "vin": "車身號碼", "vin:": "車身號碼",
        "type of vehicle": "車型", "vehicle layout": "車型架構", "mileage": "進場里程",
        "fault": "故障狀態", "log full": "日誌已滿", "number of faults": "故障總數",
        "exterior air temperature (°c)": "車外氣溫 (°C)", "engine coolant temperature (°c)": "引擎水溫 (°C)",
        "passenger compartment temperature (°c)": "車室溫度 (°C)", "status": "狀態", "state": "模組狀態",
        "features": "特徵/性質", "cause": "起因", "location": "位置"
    };

    function getTranslatedKey(keyRaw) {
        if (!keyRaw) return "";
        let cleanKey = keyRaw.toLowerCase().trim();
        let filteredKey = cleanKey.replace(/[^\w\s\(\)°/:]/gi, ''); 
        if (dict[cleanKey]) return dict[cleanKey];
        if (dict[filteredKey]) return dict[filteredKey];
        if (cleanKey.includes("battery voltage")) return "電瓶電壓 (V)";
        if (cleanKey.includes("air temperature")) return "車外氣溫 (°C)";
        if (cleanKey.includes("coolant temperature")) return "引擎水溫 (°C)";
        if (cleanKey.includes("mileage")) return "行駛里程 (km)";
        return keyRaw.charAt(0).toUpperCase() + keyRaw.slice(1);
    }

    const unitColors = {
        "built-in systems interface": "#1e3a8a", "bmf": "#1e3a8a", "bmf : built-in systems interface": "#1e3a8a",
        "engine management ecu": "#7f1d1d", "inj : engine management ecu": "#7f1d1d", "inj": "#7f1d1d",
        "power steering": "#14532d", "directn : power steering": "#14532d", "directn": "#14532d",
        "audio-navigation / connected audio system": "#4c1d95", "telemat : audio-navigation / connected audio system": "#4c1d95", "telemat": "#4c1d95",
        "automatic or piloted manual gearbox": "#831843", "boitevit : automatic or piloted manual gearbox": "#831843", "boitevit": "#831843",
        "parking assistance": "#78350f", "aas : parking assistance": "#78350f", "aas": "#78350f",
        "driver's door module": "#1e293b", "portec : driver's door module": "#1e293b", "portec": "#1e293b",
        "motorised boot unit": "#312e81", "bcm : motorised boot unit": "#312e81", "bcm": "#312e81",
        "windscreen wiper": "#134e4a", "essuiv : windscreen wiper": "#134e4a", "essuiv": "#134e4a",
        "anti-lock braking system (abs) or electronic stability program (esp)": "#064e3b", "abrasr": "#064e3b"
    };
    
    function getUnitColor(unitName) {
        if (!unitName) return "#222222";
        let nameLower = unitName.toLowerCase().trim();
        if (unitColors[nameLower]) return unitColors[nameLower];
        for (let key in unitColors) {
            if (nameLower.includes(key)) return unitColors[key];
        }
        let hash = 0;
        for (let i = 0; i < nameLower.length; i++) hash = nameLower.charCodeAt(i) + ((hash << 5) - hash);
        return `hsl(${Math.abs(hash % 360)}, 50%, 20%)`; 
    }

    function hslToHexStr(colorStr) {
        if(colorStr.startsWith('#')) return colorStr;
        let hslMatch = colorStr.match(/hsl\((\d+),\s*(\d+)\%,\s*(\d+)\%\)/);
        if(!hslMatch) return "#222222";
        let h = parseInt(hslMatch[1]), s = parseInt(hslMatch[2])/100, l = parseInt(hslMatch[3])/100;
        let c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c/2, r=0, g=0, b=0;
        if (0<=h && h<60){r=c;g=x;b=0;} else if (60<=h && h<120){r=x;g=c;b=0;} else if (120<=h && h<180){r=0;g=c;b=x;}
        else if (180<=h && h<240){r=0;g=x;b=c;} else if (240<=h && h<300){r=x;g=0;b=c;} else if (300<=h && h<360){r=c;g=0;b=x;}
        r = Math.round((r + m) * 255).toString(16).padStart(2, '0');
        g = Math.round((g + m) * 255).toString(16).padStart(2, '0');
        b = Math.round((b + m) * 255).toString(16).padStart(2, '0');
        return `#${r}${g}${b}`;
    }

    function translateFaultDescription(text) {
        let t = text; if(!t) return t;
        const patterns = [
            [/built-in systems interface/gi, "BSI(車身網絡閘道)"], [/missing information/gi, "資訊遺失"],
            [/no communication with/gi, "無通訊:"], [/communication from/gi, "通訊來自"],
            [/absence of communication with/gi, "通訊遺失:"],
            [/the driver's seat comfort ecu/gi, "駕駛座舒適模組"],
            [/the driver's seat pneumatic functions ecu/gi, "駕駛座氣壓功能模組"],
            [/data received invalid/gi, "接收資料無效"], [/outside range/gi, "超出範圍"],
            [/switch to safety mode/gi, "切換至安全模式"], [/Internal combustion engine/gi, "引擎"],
            [/oil level measurement signal/gi, "機油液位訊號"], [/multifunction video camera/gi, "多功能攝影機"],
            [/Starting monitoring \(Fuel pressure measured in the fuel high pressure common rail\)/gi, "啟動監控(柴油高壓共軌油壓測量異常)"],
            [/supply voltage too low/gi, "供電電壓過低"], [/open circuit or short circuit to positive/gi, "開路或短路至正極"],
            [/short circuit to earth/gi, "短路至接地"], [/incoherence/gi, "邏輯不一致"],
            [/configuration fault/gi, "配置錯誤(需遠端編碼)"],
            [/Traceability of the forcing of the maintaining of the lighting of the dipped headlamps/gi, "近光燈強制維持點亮追蹤(可忽略)"],
            [/A ne pas afficher Internal fault not specified/gi, "(內部未指定故障，可忽略)"]
        ];
        patterns.forEach(p => t = t.replace(p[0], p[1])); return t;
    }

    let globalFaults = []; 
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = "var(--accent-amber)"; });
    dropZone.addEventListener('dragleave', () => dropZone.style.borderColor = "var(--border)");
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault(); dropZone.style.borderColor = "var(--border)";
        if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) processFile(e.target.files[0]);
        e.target.value = '';
    });

    function processFile(file) {
        if (file.size === 0) {
            alert("警告：此檔案為 0 位元組空檔案 (常見於 DiagBox 伴隨導出的空 CSV)。請改拖入對應的 .HTML 或 .TU.xml 檔案！");
            return;
        }
        const reader = new FileReader();
        reader.onload = e => {
            const text = e.target.result;
            if (file.name.endsWith('.xml') || (text.trim().startsWith('<?xml') && text.includes('<TraceUser>'))) {
                parseTUXML(text);
            } else if (text.includes('Rapport de navigation') || text.includes('ECUs present')) {
                parseNavigationHTML(text);
            } else if (text.includes('<table') || text.includes('<TABLE')) {
                parseJDDHTML(text);
            } else {
                parseCSV(text);
            }
        };
        reader.readAsText(file, 'utf-8');
    }

    function parseJDDHTML(htmlText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const tables = doc.querySelectorAll('table');
        if (!tables.length) { alert("無法讀取 HTML 內容"); return; }

        let metaHtml = "";
        if (tables.length >= 1) {
            tables[0].querySelectorAll('tr').forEach(r => {
                const tds = r.querySelectorAll('td');
                if (tds.length >= 2) {
                    metaHtml += `<div class="meta-item"><span class="meta-key">[${getTranslatedKey(tds[0].innerText)}]</span> <span class="meta-val">${tds[1].innerText}</span></div>`;
                }
            });
        }
        document.getElementById('metaInfo').innerHTML = metaHtml;

        const faultTable = tables.length >= 2 ? tables[1] : tables[0];
        const rows = faultTable.querySelectorAll('tr');
        if (rows.length < 2) return;

        let rawHeaders = [];
        rows[0].querySelectorAll('td, th').forEach(th => rawHeaders.push(th.innerText.trim()));
        renderHeadersAndRowsFromTable(rawHeaders, rows);
    }

    function parseNavigationHTML(htmlText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');

        let metaHtml = "";
        const tables = doc.querySelectorAll('table');
        tables.forEach(t => {
            if (t.innerText.includes('VIN') || t.innerText.includes('Tool information') || t.innerText.includes('Vehicle info')) {
                t.querySelectorAll('tr').forEach(r => {
                    const tds = r.querySelectorAll('td');
                    if (tds.length >= 2) {
                        const k = tds[0].innerText.trim();
                        const v = tds[1].innerText.trim();
                        if (!k.includes('Tool information') && !k.includes('Vehicle info') && !k.includes('Info PDV') && v) {
                            metaHtml += `<div class="meta-item"><span class="meta-key">[${getTranslatedKey(k)}]</span> <span class="meta-val">${v}</span></div>`;
                        }
                    }
                });
            }
        });
        document.getElementById('metaInfo').innerHTML = metaHtml;

        let tableHead = document.getElementById('tableHead');
        tableHead.innerHTML = "<th>控制單元</th><th>故障碼</th><th>故障描述</th><th>特徵/性質</th><th>狀態</th><th>關鍵凍結數據</th>";
        buildColumnSelector(["控制單元", "故障碼", "故障描述", "特徵/性質", "狀態", "關鍵凍結數據"]);

        globalFaults = [];
        let uniqueUnits = new Set();
        let tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";

        const allLis = doc.querySelectorAll('li');

        allLis.forEach(li => {
            const text = li.innerText;
            if (text.includes('Faults present :') && li.querySelector('b')) {
                const unitName = li.querySelector('b').innerText.replace(':', '').trim();
                const faultCountMatch = text.match(/Faults present\s*:\s*(\d+)/i);
                const faultCount = faultCountMatch ? parseInt(faultCountMatch[1]) : 0;

                if (faultCount > 0) {
                    uniqueUnits.add(unitName);

                    const subLis = li.querySelectorAll('ul > li');
                    subLis.forEach(sub => {
                        const rawLine = sub.childNodes[0] ? sub.childNodes[0].textContent.trim() : "";
                        if (rawLine.startsWith('R6') || rawLine.startsWith('R5') || rawLine.includes('Response data') || rawLine.includes('Variables associated')) {
                            return;
                        }

                        const dtcMatch = rawLine.match(/^([PCBU][0-9A-F]{4}(?:\s+[0-9A-F]{2})?)\s*:\s*(.*)/i);
                        if (!dtcMatch) return;

                        const code = dtcMatch[1].trim();
                        const desc = dtcMatch[2].trim();

                        const subHtml = sub.innerHTML;
                        const charMatch = subHtml.match(/(?:Characterisation|features)\s*:\s*([^<]+)/i);
                        const statusMatch = subHtml.match(/status\s*:\s*([^<]+)/i);
                        const charVal = charMatch ? charMatch[1].trim() : "-";
                        const statusVal = statusMatch ? statusMatch[1].trim() : "-";

                        let freezeData = [];
                        sub.querySelectorAll('li').forEach(vLi => {
                            const vt = vLi.innerText.trim();
                            if (vt.includes('km') || vt.includes('V') || vt.includes('rpm') || vt.includes('°C') || vt.includes('speed') || vt.includes('voltage')) {
                                freezeData.push(vt);
                            }
                        });

                        let tr = document.createElement('tr');
                        tr.setAttribute('data-unit', unitName);
                        const rowColor = getUnitColor(unitName);
                        if (rowColor) {
                            tr.style.backgroundColor = rowColor;
                            tr.setAttribute('data-color', hslToHexStr(rowColor));
                        }

                        tr.innerHTML = `
                            <td style="color:#fff; font-weight:bold;">${unitName}</td>
                            <td class="fault-code" style="color:#ffcc00; font-weight:bold;">${code}</td>
                            <td class="fault-desc" style="color:#fff;">${translateFaultDescription(desc)}<br><span class="desc-en">(${desc})</span></td>
                            <td style="color:#fff;">${charVal}</td>
                            <td style="color:#fff;">${statusVal}</td>
                            <td style="color:#7dcfff; font-size:0.8rem; white-space:normal;">${freezeData.join(' | ')}</td>
                        `;
                        tableBody.appendChild(tr);

                        let voltMatch = freezeData.join(' ').match(/(\d+\.?\d*)\s*V/i);
                        globalFaults.push({
                            unit: unitName,
                            code: code,
                            desc: desc,
                            volt: voltMatch ? voltMatch[1] : ""
                        });
                    });
                }
            }
        });

        finishParsing(uniqueUnits);
    }

    function parseTUXML(xmlText) {
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, 'text/xml');

        let metaHtml = "";
        const veh = xmlDoc.querySelector('InfoVEH');
        if (veh) {
            metaHtml += `<div class="meta-item"><span class="meta-key">[車型]</span> <span class="meta-val">${veh.querySelector('Trademark')?.textContent || ''} ${veh.querySelector('Name')?.textContent || ''}</span></div>`;
            metaHtml += `<div class="meta-item"><span class="meta-key">[車身號碼]</span> <span class="meta-val">${veh.querySelector('VIN')?.textContent || ''}</span></div>`;
            metaHtml += `<div class="meta-item"><span class="meta-key">[進場里程]</span> <span class="meta-val">${veh.querySelector('KM')?.textContent || ''} km</span></div>`;
            metaHtml += `<div class="meta-item"><span class="meta-key">[電瓶初始電壓]</span> <span class="meta-val">${veh.querySelector('tensionBefore')?.textContent || ''} V</span></div>`;
        }
        document.getElementById('metaInfo').innerHTML = metaHtml;

        let tableHead = document.getElementById('tableHead');
        tableHead.innerHTML = "<th>控制單元</th><th>狀態</th><th>故障碼</th><th>故障描述</th><th>關鍵凍結數據</th>";
        buildColumnSelector(["控制單元", "狀態", "故障碼", "故障描述", "關鍵凍結數據"]);

        globalFaults = [];
        let uniqueUnits = new Set();
        let tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";

        const families = xmlDoc.querySelectorAll('Dir[name^="family_"]');
        families.forEach(fam => {
            const dtcCountElem = fam.querySelector('Dir[name="dtc"] > Entry[name="count"]');
            const count = dtcCountElem ? parseInt(dtcCountElem.getAttribute('value')) : 0;
            if (count > 0) {
                const ecuName = fam.querySelector(':scope > Entry[name="name"]')?.getAttribute('value') || "ECU";
                const ecuDescr = fam.querySelector(':scope > Entry[name="descr"]')?.getAttribute('value') || "";
                const fullUnitName = ecuDescr ? `${ecuName} (${ecuDescr})` : ecuName;
                uniqueUnits.add(fullUnitName);

                fam.querySelectorAll('Dir[name^="dtc_"]').forEach(dtcDir => {
                    const code = dtcDir.querySelector('Entry[name="name_uds"]')?.getAttribute('value') || dtcDir.querySelector('Entry[name="name"]')?.getAttribute('value') || "";
                    const desc = dtcDir.querySelector('Entry[name="descr"]')?.getAttribute('value') || "";
                    const status = dtcDir.querySelector('Dir[name="status"] Entry[name="descr"]')?.getAttribute('value') || "-";

                    let vars = [];
                    dtcDir.querySelectorAll('Dir[name^="var_"]').forEach(v => {
                        const d = v.querySelector('Entry[name="descr"]')?.getAttribute('value') || "";
                        const val = v.querySelector('Entry[name="value"]')?.getAttribute('value') || "";
                        const u = v.querySelector('Entry[name="unit"]')?.getAttribute('value') || "";
                        if (val && (u === 'V' || u === 'km' || u === 'rpm' || u === '°C' || d.includes('voltage') || d.includes('speed'))) {
                            vars.push(`${d}: ${val}${u}`);
                        }
                    });

                    let tr = document.createElement('tr');
                    tr.setAttribute('data-unit', fullUnitName);
                    const rowColor = getUnitColor(fullUnitName);
                    if (rowColor) {
                        tr.style.backgroundColor = rowColor;
                        tr.setAttribute('data-color', hslToHexStr(rowColor));
                    }

                    tr.innerHTML = `
                        <td style="color:#fff; font-weight:bold;">${fullUnitName}</td>
                        <td style="color:#fff;">${status}</td>
                        <td class="fault-code" style="color:#ffcc00; font-weight:bold;">${code}</td>
                        <td class="fault-desc" style="color:#fff;">${translateFaultDescription(desc)}<br><span class="desc-en">(${desc})</span></td>
                        <td style="color:#7dcfff; font-size:0.8rem; white-space:normal;">${vars.join(' | ')}</td>
                    `;
                    tableBody.appendChild(tr);

                    let voltMatch = vars.join(' ').match(/(\d+\.?\d*)\s*V/i);
                    globalFaults.push({
                        unit: fullUnitName,
                        code: code,
                        desc: desc,
                        volt: voltMatch ? voltMatch[1] : ""
                    });
                });
            }
        });

        finishParsing(uniqueUnits);
    }

    function parseCSV(text) {
        globalFaults = [];
        let uniqueUnits = new Set(); 
        const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
        let metaHtml = "", headerIndex = -1;

        for (let i = 0; i < lines.length; i++) {
            let lLower = lines[i].toLowerCase();
            if ((lLower.includes('fault code') || lLower.includes('code d') || lLower.includes('dtc')) && 
                (lLower.includes('control unit') || lLower.includes('calculateur') || lLower.includes('date time'))) {
                headerIndex = i; break;
            }
        }

        if (headerIndex === -1) { 
            alert("解析失敗：無法辨識表頭結構。請確認這是一份正確的 DiagBox 導出報表。"); 
            return; 
        }

        const headerLine = lines[headerIndex];
        const separator = (headerLine.split(';').length > headerLine.split(',').length) ? ';' : ',';

        for (let i = 0; i < headerIndex; i++) {
            let parts = lines[i].split(separator);
            if (parts.length >= 2 && parts[0]) {
                let keyRaw = parts[0].replace(/^"|"$/g, '').trim();
                let val = parts[1].replace(/^"|"$/g, '').trim();
                let translatedKey = getTranslatedKey(keyRaw);
                if(keyRaw) metaHtml += `<div class="meta-item"><span class="meta-key">[${translatedKey}]</span> <span class="meta-val">${val}</span></div>`;
            }
        }
        document.getElementById('metaInfo').innerHTML = metaHtml;

        let rawHeaders = lines[headerIndex].split(separator).map(h => h.replace(/^"|"$/g, '').trim());
        renderHeadersAndRowsFromCSV(rawHeaders, lines.slice(headerIndex + 1), separator);
    }

    function renderHeadersAndRowsFromTable(rawHeaders, rows) {
        let tableHead = document.getElementById('tableHead');
        tableHead.innerHTML = "";
        let colIndexes = { unit: -1, code: -1, desc: -1, time: -1, volt: -1 };
        let translatedHeaders = [];

        rawHeaders.forEach((header, index) => {
            let hLower = header.toLowerCase();
            if (hLower.includes('control unit')) colIndexes.unit = index;
            if (hLower.includes('fault code')) colIndexes.code = index;
            if (hLower.includes('fault description')) colIndexes.desc = index;
            if (hLower.includes('date time')) colIndexes.time = index;
            if (hLower.includes('battery voltage')) colIndexes.volt = index;

            let translated = getTranslatedKey(header);
            translatedHeaders.push(translated);
            let th = document.createElement('th');
            th.innerText = translated;
            tableHead.appendChild(th);
        });

        buildColumnSelector(translatedHeaders);

        globalFaults = [];
        let uniqueUnits = new Set();
        let tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";

        for (let i = 1; i < rows.length; i++) {
            let cells = rows[i].querySelectorAll('td');
            if (cells.length < 3) continue;

            let tr = document.createElement('tr');
            let rowData = {};
            let unitName = cells[colIndexes.unit] ? cells[colIndexes.unit].innerText.trim() : "";

            if (unitName) {
                uniqueUnits.add(unitName);
                tr.setAttribute('data-unit', unitName);
                let rowColor = getUnitColor(unitName);
                if (rowColor) {
                    tr.style.backgroundColor = rowColor;
                    tr.setAttribute('data-color', hslToHexStr(rowColor));
                }
            }

            cells.forEach((tdElem, j) => {
                let val = tdElem.innerText.trim().replace(/\u00a0/g, ' ');
                let td = document.createElement('td');
                td.style.color = "#ffffff";

                if (j === colIndexes.desc && val !== "") {
                    let translatedText = translateFaultDescription(val);
                    td.innerHTML = (translatedText !== val) ? `${translatedText} <br><span class="desc-en">(${val})</span>` : val;
                    td.className = 'fault-desc';
                    rowData.desc = val;
                } else {
                    td.innerText = val;
                    if (j === colIndexes.code) { td.className = 'fault-code'; rowData.code = val; }
                    if (j === colIndexes.unit) rowData.unit = val;
                    if (j === colIndexes.volt) rowData.volt = val;
                }
                tr.appendChild(td);
            });

            tableBody.appendChild(tr);
            if (rowData.code) globalFaults.push(rowData);
        }

        finishParsing(uniqueUnits);
    }

    function renderHeadersAndRowsFromCSV(rawHeaders, dataLines, separator) {
        let tableHead = document.getElementById('tableHead');
        tableHead.innerHTML = "";
        let colIndexes = { unit: -1, code: -1, desc: -1, time: -1, volt: -1 };
        let translatedHeaders = [];

        rawHeaders.forEach((header, index) => {
            let hLower = header.toLowerCase();
            if (hLower.includes('control unit')) colIndexes.unit = index;
            if (hLower.includes('fault code')) colIndexes.code = index;
            if (hLower.includes('fault description')) colIndexes.desc = index;
            if (hLower.includes('date time')) colIndexes.time = index;
            if (hLower.includes('battery voltage')) colIndexes.volt = index;

            let translated = getTranslatedKey(header);
            translatedHeaders.push(translated);
            let th = document.createElement('th');
            th.innerText = translated;
            tableHead.appendChild(th);
        });

        buildColumnSelector(translatedHeaders);

        globalFaults = [];
        let uniqueUnits = new Set();
        let tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = "";

        dataLines.forEach(line => {
            let cols = [], inQuotes = false, currentVal = '';
            for (let char of line) {
                if (char === '"' && inQuotes) inQuotes = false;
                else if (char === '"' && !inQuotes) inQuotes = true;
                else if (char === separator && !inQuotes) { cols.push(currentVal); currentVal = ''; }
                else currentVal += char;
            }
            cols.push(currentVal);
            if (cols.length < 3) return;

            let tr = document.createElement('tr');
            let rowData = {};
            let unitName = cols[colIndexes.unit] ? cols[colIndexes.unit].replace(/^"|"$/g, '').trim() : "";

            if (unitName) {
                uniqueUnits.add(unitName);
                tr.setAttribute('data-unit', unitName);
                let rowColor = getUnitColor(unitName);
                if (rowColor) {
                    tr.style.backgroundColor = rowColor;
                    tr.setAttribute('data-color', hslToHexStr(rowColor));
                }
            }

            rawHeaders.forEach((h, j) => {
                let val = cols[j] ? cols[j].replace(/^"|"$/g, '').trim() : "";
                let td = document.createElement('td');
                td.style.color = "#ffffff";

                if (j === colIndexes.desc && val !== "") {
                    let translatedText = translateFaultDescription(val);
                    td.innerHTML = (translatedText !== val) ? `${translatedText} <br><span class="desc-en">(${val})</span>` : val;
                    td.className = 'fault-desc';
                    rowData.desc = val;
                } else {
                    td.innerText = val;
                    if (j === colIndexes.code) { td.className = 'fault-code'; rowData.code = val; }
                    if (j === colIndexes.unit) rowData.unit = val;
                    if (j === colIndexes.volt) rowData.volt = val;
                }
                tr.appendChild(td);
            });

            tableBody.appendChild(tr);
            if (rowData.code) globalFaults.push(rowData);
        });

        finishParsing(uniqueUnits);
    }

    function finishParsing(unitsSet) {
        buildUnitFilter(unitsSet);
        document.getElementById('dropZone').style.display = 'none';
        document.getElementById('output').style.display = 'block';
        document.getElementById('controlsPanel').style.display = 'flex';
        document.getElementById('analysisPanel').classList.remove('active');
    }

    function buildUnitFilter(unitsSet) {
        let unitFilter = document.getElementById('unitFilter');
        unitFilter.innerHTML = '<option value="ALL">▰ 所有模組 (ALL)</option>';
        Array.from(unitsSet).sort().forEach(unit => {
            let opt = document.createElement('option');
            opt.value = unit; opt.innerText = unit.toUpperCase();
            unitFilter.appendChild(opt);
        });
        unitFilter.style.display = 'inline-block';
        unitFilter.value = "ALL"; 
    }
    
    function filterByUnit() {
        let selectedUnit = document.getElementById('unitFilter').value;
        document.querySelectorAll('#tableBody tr').forEach(tr => {
            tr.style.display = (selectedUnit === "ALL" || tr.getAttribute('data-unit') === selectedUnit) ? '' : 'none';
        });
    }

    // 構建欄位過濾器（含全選/全反選勾勾）
    function buildColumnSelector(headers) {
        const container = document.getElementById('columnSelectorPanel');
        container.innerHTML = '';

        // 1. 建立「全選 / 全反選」按鈕
        let masterLabel = document.createElement('label');
        masterLabel.className = 'col-toggle col-toggle-all';
        let masterCb = document.createElement('input');
        masterCb.type = 'checkbox';
        masterCb.checked = true;
        masterCb.id = 'toggleAllColumns';
        masterCb.onchange = (e) => toggleAllColumnsVisibility(e.target.checked, headers.length);
        
        masterLabel.appendChild(masterCb);
        masterLabel.appendChild(document.createTextNode('全選 / 全不選 (TOGGLE ALL)'));
        container.appendChild(masterLabel);

        // 2. 建立各別欄位勾選框
        headers.forEach((h, index) => {
            let label = document.createElement('label'); 
            label.className = 'col-toggle';
            let cb = document.createElement('input'); 
            cb.type = 'checkbox'; 
            cb.checked = true;
            cb.className = 'single-col-cb';
            cb.onchange = (e) => {
                toggleColumnVisibility(index, e.target.checked);
                // 檢查是否所有個別勾選框都已勾選
                const allCbs = document.querySelectorAll('.single-col-cb');
                const checkedCount = document.querySelectorAll('.single-col-cb:checked').length;
                document.getElementById('toggleAllColumns').checked = (checkedCount === allCbs.length);
            };
            label.appendChild(cb); 
            label.appendChild(document.createTextNode(h));
            container.appendChild(label);
        });
    }

    // 一鍵全選 / 全不選切換
    function toggleAllColumnsVisibility(isChecked, totalCols) {
        document.querySelectorAll('.single-col-cb').forEach(cb => {
            cb.checked = isChecked;
        });
        for (let i = 0; i < totalCols; i++) {
            toggleColumnVisibility(i, isChecked);
        }
    }

    function toggleColumnPanel() { document.getElementById('columnSelectorPanel').classList.toggle('active'); }
    function toggleColumnVisibility(index, isVisible) {
        document.querySelectorAll(`#dataTable th:nth-child(${index + 1}), #dataTable td:nth-child(${index + 1})`).forEach(cell => {
            cell.style.display = isVisible ? '' : 'none';
        });
    }

    function runStellantisAnalysis() {
        const panel = document.getElementById('analysisPanel');
        const content = document.getElementById('analysisContent');
        panel.classList.add('active');
        
        let uCodeCount = 0, bCodeCount = 0, pCodeCount = 0, hasLowVolt = false, hasP2291 = false, hasB1003 = false;
        let unitsAffected = new Set();

        globalFaults.forEach(f => {
            let c = (f.code || '').toUpperCase();
            if(c.startsWith('U')) uCodeCount++; if(c.startsWith('B')) bCodeCount++; if(c.startsWith('P')) pCodeCount++;
            if(c.includes('P2291')) hasP2291 = true;
            if(c.includes('B1003')) hasB1003 = true;
            if(f.unit) unitsAffected.add(f.unit);
            
            let volt = parseFloat(f.volt);
            if(!isNaN(volt) && volt < 11.5 && volt > 0) hasLowVolt = true;
        });

        let report = `<div class="analysis-point">掃描總結：共檢測到 <span class="analysis-highlight">${globalFaults.length}</span> 筆故障，橫跨 <span class="analysis-highlight">${unitsAffected.size}</span> 個控制單元。</div>`;
        report += `<div class="analysis-point">協議分佈：網路通訊 (U碼) ${uCodeCount} 筆 | 車身系統 (B碼) ${bCodeCount} 筆 | 動力系統 (P碼) ${pCodeCount} 筆。</div><hr style="border-color:var(--danger); opacity:0.3; margin:10px 0;">`;

        if (hasP2291) report += `<div class="analysis-point">⚠️ <span class="analysis-highlight">高壓燃油啟動壓力異常 (P2291)</span>：柴油高壓共軌啟動建壓過慢。若凍結影格顯示啟動瞬間電壓低於 10V (如 9.46V)，強烈指向電瓶效能劣化導致啟動馬達拖慢轉速，進而影響高壓泵建壓速度。</div>`;
        if (hasB1003) report += `<div class="analysis-point">⚠️ <span class="analysis-highlight">控制電腦配置遺失 (B1003 55)</span>：偵測到 BCM 電動尾門或其他模組存在遠端配置未完成問題，需執行 DiagBox 線上或手動配置並進行極限位置初始化。</div>`;
        if (hasLowVolt) report += `<div class="analysis-point">⚠️ <span class="analysis-highlight">低壓骨牌效應 (Low Voltage Storm)</span>：多個模組記錄到供電電壓過低 (<11.5V)，車門與雨刷模組容易因暫態失壓回報通訊中斷，請優先進行 12V 輔助電瓶負載測試。</div>`;
        if (uCodeCount > (bCodeCount + pCodeCount)) report += `<div class="analysis-point">⚠️ <span class="analysis-highlight">通訊雪崩 (U-Code Storm)</span>：U 碼佔比極高，建議優先檢查主搭鐵點與 BSI 供電線路。</div>`;

        content.innerHTML = report;
    }

    function exportTableToExcel() {
        let table = document.getElementById("dataTable").cloneNode(true);
        let realRows = document.querySelectorAll("#dataTable tr");
        let clonedRows = table.querySelectorAll("tr");
        
        for(let i = clonedRows.length - 1; i >= 0; i--) {
            if (window.getComputedStyle(realRows[i]).display === 'none') { clonedRows[i].remove(); continue; }
            let realCols = realRows[i].querySelectorAll("th, td");
            let clonedCols = clonedRows[i].querySelectorAll("th, td");
            for(let j = clonedCols.length - 1; j >= 0; j--) {
                if (window.getComputedStyle(realCols[j]).display === 'none') clonedCols[j].remove();
            }
        }
        
        table.querySelectorAll("tr").forEach(tr => {
            let hexColor = tr.getAttribute('data-color');
            if(hexColor) {
                tr.querySelectorAll('td').forEach(td => {
                    td.style.backgroundColor = hexColor; td.style.color = "#FFFFFF"; 
                    td.innerHTML = td.innerHTML.replace(/<br\s*[\/]?>/gi, "&#10;").replace(/<[^>]*>?/gm, ''); 
                    td.style.msoNumberFormat = "\\@"; 
                });
            }
        });

        let metaHtml = "<table><tr>";
        document.querySelectorAll('.meta-item').forEach(item => {
            let k = item.querySelector('.meta-key').innerText; let v = item.querySelector('.meta-val').innerText;
            metaHtml += `<td style="font-weight:bold; background-color:#e0af68; color:#000;">${k}</td><td>${v}</td><td style="width:20px;"></td>`;
        });
        metaHtml += "</tr></table><br>";

        let finalHtml = `
            <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
            <head><meta charset="utf-8"><style>table{border-collapse:collapse;}th,td{border:1px solid #666;padding:5px;font-family:sans-serif;font-size:12px;}th{background-color:#1a1b26;color:#7dcfff;font-weight:bold;}</style></head>
            <body>${metaHtml}${table.outerHTML}</body></html>
        `;

        let blob = new Blob([finalHtml], { type: 'application/vnd.ms-excel' });
        let downloadLink = document.createElement("a");
        let now = new Date();
        let timestamp = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}_${now.getHours().toString().padStart(2,'0')}${now.getMinutes().toString().padStart(2,'0')}`;
        
        downloadLink.download = `Stellantis_ColorDecoded_${timestamp}.xls`; 
        downloadLink.href = window.URL.createObjectURL(blob);
        downloadLink.style.display = "none";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
    }
</script>
